<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- ui-monospace is used on some sites, i.e. GitHub -->
	<!-- <match target="pattern"> -->
	<!-- 	<test qual="any" name="family"> -->
	<!-- 		<string>ui-monospace</string> -->
	<!-- 	</test> -->
	<!-- 	<edit name="family" mode="assign"> -->
	<!-- 		<string>monospace</string> -->
	<!-- 	</edit> -->
	<!-- </match> -->

	<alias>
		<family>serif</family>
		<prefer>
			<family>DejaVu Serif</family>
		</prefer>
	</alias>

	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>DejaVu Sans</family>
		</prefer>
	</alias>

	<alias>
		<family>ui-monospace</family>
		<prefer>
			<family>JetBrains Mono NL</family>
		</prefer>
	</alias>

	<alias>
		<family>monospace</family>
		<prefer>
			<family>JetBrains Mono NL</family>
		</prefer>
	</alias>

	<!-- Nerd Fonts fallback for monospace -->
	<match target="pattern">
		<test name="family">
			<string>monospace</string>
		</test>
		<edit name="family" mode="append">
			<string>Symbols Nerd Font Mono</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>JetBrains Mono</string>
		</test>
		<edit name="family" mode="append">
			<string>Symbols Nerd Font Mono</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>JetBrains Mono NL</string>
		</test>
		<edit name="family" mode="append">
			<string>Symbols Nerd Font Mono</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>Iosevka Term</string>
		</test>
		<edit name="family" mode="append">
			<string>Symbols Nerd Font Mono</string>
		</edit>
	</match>

	<!-- Nerd Fonts fallback for regular -->
	<match target="pattern">
		<test name="family">
			<string>sans</string>
		</test>
		<edit name="family" mode="append">
			<string>Symbols Nerd Font</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>serif</string>
		</test>
		<edit name="family" mode="append">
			<string>Symbols Nerd Font</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>sans-serif</string>
		</test>
		<edit name="family" mode="append">
			<string>Symbols Nerd Font</string>
		</edit>
	</match>

	<!-- Disable some fonts -->
	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="family">
					<string>Consolas</string>
				</patelt>
			</pattern>
			<pattern>
				<patelt name="family">
					<string>Courier New</string>
				</patelt>
			</pattern>
			<pattern>
				<patelt name="family">
					<string>Liberation Mono</string>
				</patelt>
			</pattern>
			<pattern>
				<patelt name="family">
					<string>Nimbus Mono PS</string>
				</patelt>
			</pattern>
		</rejectfont>
	</selectfont>
</fontconfig>
<!-- vim: set ft=xml: -->
